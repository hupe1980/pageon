# The pageon website: landing page and documentation (https://www.getzola.org).
#   zola serve    # http://127.0.0.1:1111, live reload
#   zola build    # → public/
base_url = "https://hupe1980.github.io/pageon"
title = "pageon: the browser engine built for AI agents"
description = "Open-source browser engine in Rust for AI agents: compact views with stable refs, typed actions, sandboxed pages and replay. MCP, Python, CDP and BiDi."
default_language = "en"
compile_sass = true
minify_html = true
build_search_index = true
generate_sitemap = true
generate_robots_txt = true
generate_feeds = false
author = "hupe1980"

[markdown]
smart_punctuation = true
external_links_target_blank = false
external_links_no_follow = false
external_links_no_referrer = true
bottom_footnotes = true

[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark"

[search]
include_title = true
include_description = true
include_content = true
truncate_content_length = 600

[extra]
repo = "https://github.com/hupe1980/pageon"
edit_base = "https://github.com/hupe1980/pageon/edit/main/site/content/"
keywords = "browser engine, AI agents, MCP server, headless browser, browser automation, LLM, Puppeteer, Playwright, WebDriver BiDi, Rust, accessibility tree, web agents"
