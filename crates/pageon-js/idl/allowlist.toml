# The script-visible surface: per interface (or mixin), the members pageon implements by hand.
#
# Generated automatically for every interface below, without being listed:
# - `[Reflect]` attributes with a scalar type (strings, booleans, integers, doubles, URLs);
# - `EventHandler` attributes (`onclick`, …), routed to the generic handler store;
# - constants.
# Every `HTML…Element` interface exposed to Window is included for its reflected attributes.
# Anything not generated or listed here is absent from the page: feature detection works.
#
# Members are implemented in `src/dom/<owner_snake>.rs` as `<member_snake>` (operations),
# `get_<attr>` / `set_<attr>` (attributes) and `constructor`. A missing implementation is a
# compile error.

[EventTarget]
members = ["addEventListener", "removeEventListener", "dispatchEvent"]

[Event]
members = [
  "constructor", "type", "target", "srcElement", "currentTarget", "eventPhase", "stopPropagation",
  "cancelBubble", "stopImmediatePropagation", "bubbles", "cancelable", "returnValue", "preventDefault",
  "defaultPrevented", "composed", "isTrusted", "timeStamp", "initEvent", "composedPath",
]

