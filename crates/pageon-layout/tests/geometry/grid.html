<!doctype html><html><head><style>
.g{display:grid;grid-template-columns:120px 1fr 2fr;gap:10px;padding:10px;border:1px solid}
.g>div{border:1px solid;padding:4px}.span2{grid-column:span 2}.areas{display:grid;grid-template-areas:"h h" "s m";grid-template-columns:200px 1fr;grid-auto-rows:minmax(40px,auto)}
.h{grid-area:h;background:#eee}.s{grid-area:s}.m{grid-area:m}
</style></head><body>
<div class="g"><div>1</div><div>2</div><div>3</div><div class="span2">wide cell</div><div>6</div></div>
<div class="areas"><header class="h">Header</header><nav class="s">Side</nav><main class="m"><p>Main content with a longer line of text that wraps inside the grid area.</p></main></div>
</body></html>
