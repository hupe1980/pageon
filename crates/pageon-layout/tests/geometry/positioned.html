<!doctype html><html><head><style>
.rel{position:relative;width:400px;height:200px;border:1px solid;margin:20px}
.abs{position:absolute;top:10px;right:20px;width:100px;height:50px;border:1px solid}
.fix{position:fixed;bottom:0;left:0;right:0;height:40px;border-top:1px solid}
.z1{position:absolute;left:30px;top:60px;width:120px;height:80px;z-index:1;border:1px solid}
.z2{position:absolute;left:60px;top:90px;width:120px;height:80px;z-index:2;border:1px solid}
.shift{position:relative;left:15px;top:5px}
</style></head><body>
<div class="rel"><div class="abs">abs</div><div class="z1">z1</div><div class="z2">z2 <button>on top</button></div></div>
<p class="shift">relatively shifted paragraph</p><div class="fix">fixed footer <a href="#">link</a></div>
</body></html>
