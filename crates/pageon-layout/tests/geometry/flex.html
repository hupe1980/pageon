<!doctype html><html><head><style>
.row{display:flex;gap:12px;padding:8px;border:1px solid #333}.row>div{padding:6px 10px;border:1px solid}
.grow{flex:1}.col{display:flex;flex-direction:column;align-items:flex-start;width:300px}
.wrap{display:flex;flex-wrap:wrap;width:260px}.wrap span{width:80px;height:30px;margin:2px;border:1px solid}
.center{display:flex;justify-content:space-between;align-items:center;height:80px;border:1px dashed}
</style></head><body>
<div class="row"><div>One</div><div class="grow">Grow</div><div>Three</div></div>
<div class="col"><button>Alpha</button><button>Beta beta</button><a href="#">Gamma</a></div>
<div class="wrap"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span></div>
<div class="center"><span>left</span><strong>middle text</strong><em>right</em></div>
</body></html>
