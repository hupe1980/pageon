<!doctype html><title>Chat</title><button id=ask>Ask</button><p id=answer></p>
<script>
// A streaming chat UI, read the way the Vercel AI SDK and the model vendors' clients read it.
ask.addEventListener('click', async () => {
  const res = await fetch('/api/chat', { method: 'POST', body: JSON.stringify({ prompt: 'hi' }) });
  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
  for (let r = await reader.read(); !r.done; r = await reader.read()) {
    for (const line of r.value.split('\n')) if (line.startsWith('data: ')) answer.textContent += line.slice(6);
  }
});
</script>
