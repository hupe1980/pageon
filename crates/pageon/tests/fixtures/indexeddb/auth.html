<!doctype html><meta charset=utf-8><title>App</title>
<p id=who>loading</p><button id=signin>Sign in</button>
<script>
// The pattern Firebase Auth uses: one store keyed by a fixed key, opened on every load.
const open = () => new Promise((resolve, reject) => {
  const r = indexedDB.open('firebaseLocalStorageDb', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('firebaseLocalStorage', { keyPath: 'fbase_key' });
  r.onsuccess = () => resolve(r.result);
  r.onerror = () => reject(r.error);
});
const tx = async (mode, f) => {
  const db = await open();
  return new Promise((resolve, reject) => {
    const t = db.transaction('firebaseLocalStorage', mode);
    const req = f(t.objectStore('firebaseLocalStorage'));
    t.oncomplete = () => resolve(req && req.result);
    t.onerror = () => reject(t.error);
  });
};
const show = async () => {
  const user = await tx('readonly', (s) => s.get('firebase:authUser:key:[DEFAULT]'));
  who.textContent = user ? 'signed in as ' + user.value.email : 'signed out';
};
signin.onclick = async () => {
  await tx('readwrite', (s) => s.put({ fbase_key: 'firebase:authUser:key:[DEFAULT]', value: { email: 'agent@app.test' } }));
  await show();
};
show();
</script>
