<!doctype html>
<html><head><meta charset=utf-8><title>Editing</title></head>
<body>
<p id=p>Hello <b id=b>bold</b> world</p>
<div id=ed contenteditable><p id=e1>one two</p><p id=e2>three</p></div>
<input id=f value="abcdef"><textarea id=ta>line one
line two</textarea><input id=num type=number>
<pre id=out></pre>
<script>
// Behaviour derived from the web-platform-tests of dom/ranges, dom/nodes (CharacterData,
// Text.splitText), selection, editing (execCommand), html/semantics/forms/textfieldselection,
// clipboard-apis and cssom-view (caretPositionFromPoint, Range.getClientRects).
const results = [];
const check = (name, ok) => results.push([name, !!ok]);
const throws = (f, name) => { try { f(); return false; } catch (e) { return e.name === name; } };
const rejects = async (p, name) => { try { await p; return false; } catch (e) { return e.name === name; } };

async function main() {
  // ----- CharacterData and Text -----
  const t = document.createTextNode('hello world');
  check('substringData', t.substringData(6, 5) === 'world');
  t.insertData(5, ',');
  check('insertData', t.data === 'hello, world');
  t.deleteData(5, 1);
  check('deleteData', t.data === 'hello world');
  t.replaceData(0, 5, 'HELLO');
  check('replaceData', t.data === 'HELLO world');
  check('substringData past the length throws IndexSizeError', throws(() => t.substringData(99, 1), 'IndexSizeError'));
  const host = document.createElement('div');
  const t2 = document.createTextNode('abcdef');
  host.append(t2);
  const tail = t2.splitText(2);
  check('splitText', t2.data === 'ab' && tail.data === 'cdef' && t2.nextSibling === tail);

  // ----- Range -----
  const r = document.createRange();
  check('a new range is collapsed at the document', r.collapsed && r.startContainer === document && r.startOffset === 0);
  check('new Range()', new Range() instanceof Range && new Range() instanceof AbstractRange);
  const text = p.firstChild;
  r.setStart(text, 2);
  r.setEnd(b.firstChild, 2);
  check('toString across nodes', r.toString() === 'llo bo');
  check('commonAncestorContainer', r.commonAncestorContainer === p);
  check('setStart past the length throws IndexSizeError', throws(() => r.setStart(text, 99), 'IndexSizeError'));
  check('setStart on a doctype throws InvalidNodeTypeError', throws(() => r.setStart(document.doctype, 0), 'InvalidNodeTypeError'));
  check('isPointInRange', r.isPointInRange(text, 4) && !r.isPointInRange(text, 1));
  check('comparePoint', r.comparePoint(text, 0) === -1 && r.comparePoint(text, 3) === 0 && r.comparePoint(p, 3) === 1);
  check('intersectsNode', r.intersectsNode(b) && !r.intersectsNode(ed));
  const frag = r.cloneContents();
  check('cloneContents', frag.textContent === 'llo bo' && frag.childNodes.length === 2);
  const r2 = r.cloneRange();
  check('cloneRange', r2.startOffset === 2 && r2 !== r);
  check('compareBoundaryPoints', r.compareBoundaryPoints(Range.START_TO_START, r2) === 0);
  // A live range follows mutations.
  const live = document.createRange();
  live.setStart(text, 3);
  live.setEnd(text, 5);
  text.insertData(0, '>>');
  check('a live range moves with inserted data', live.startOffset === 5 && live.endOffset === 7);
  text.deleteData(0, 2);
  const inner = document.createRange();
  inner.selectNodeContents(b);
  const removed = b.firstChild;
  b.removeChild(removed);
  check('a removed boundary collapses to its parent', inner.startContainer === b && inner.endOffset === 0);
  b.appendChild(removed);
  // extract, delete, insert, surround
  const box = document.createElement('div');
  box.innerHTML = '<i>abc</i><u>def</u>';
  document.body.append(box);
  const x = document.createRange();
  x.setStart(box.firstChild.firstChild, 1);
  x.setEnd(box.lastChild.firstChild, 2);
  const ex = x.extractContents();
  check('extractContents', box.innerHTML === '<i>a</i><u>f</u>' && ex.textContent === 'bcde' && x.collapsed);
  x.insertNode(document.createTextNode('*'));
  check('insertNode', box.innerHTML === '<i>a</i>*<u>f</u>');
  x.selectNodeContents(box);
  x.deleteContents();
  check('deleteContents', box.innerHTML === '');
  box.innerHTML = 'one two';
  const y = document.createRange();
  y.setStart(box.firstChild, 4);
  y.setEnd(box.firstChild, 7);
  y.surroundContents(document.createElement('em'));
  check('surroundContents', box.innerHTML === 'one <em>two</em>');
  box.remove();
  check('StaticRange', (() => {
    const s = new StaticRange({ startContainer: text, startOffset: 1, endContainer: text, endOffset: 3 });
    return s.startOffset === 1 && s.endContainer === text && !s.collapsed && !('setStart' in s);
  })());
  check('StaticRange refuses a doctype', throws(() => new StaticRange({ startContainer: document.doctype, startOffset: 0, endContainer: text, endOffset: 0 }), 'InvalidNodeTypeError'));

  // ----- geometry -----
  const g = document.createRange();
  g.selectNodeContents(b);
  const rects = g.getClientRects();
  const bb = b.getBoundingClientRect();
  check('Range.getClientRects comes from layout', rects.length >= 1 && Math.abs(rects[0].left - bb.left) < 2 && rects[0].width > 10);
  check('getBoundingClientRect of a range', Math.abs(g.getBoundingClientRect().width - bb.width) < 2);
  const caret = document.caretPositionFromPoint(bb.left + 1, bb.top + bb.height / 2);
  check('caretPositionFromPoint finds the text', caret && caret.offsetNode === b.firstChild && caret.offset <= 1);
  const end = document.caretPositionFromPoint(bb.right - 1, bb.top + bb.height / 2);
  check('caretPositionFromPoint at the end of a word', end && end.offsetNode === b.firstChild && end.offset >= 3);
  const collapsed = document.createRange();
  collapsed.setStart(b.firstChild, 2);
  const cr = collapsed.getClientRects();
  check('a collapsed range has a caret rectangle', cr.length === 1 && cr[0].width === 0 && cr[0].height > 0);

  // ----- Selection -----
  const sel = getSelection();
  check('getSelection is the same object', sel === document.getSelection() && sel === window.getSelection());
  sel.removeAllRanges();
  check('an empty selection', sel.rangeCount === 0 && sel.type === 'None' && sel.anchorNode === null);
  sel.collapse(text, 1);
  check('collapse', sel.type === 'Caret' && sel.anchorNode === text && sel.focusOffset === 1 && sel.isCollapsed);
  sel.extend(text, 4);
  check('extend', sel.type === 'Range' && sel.toString() === 'ell' && sel.direction === 'forward');
  sel.setBaseAndExtent(text, 4, text, 1);
  check('setBaseAndExtent backwards', sel.anchorOffset === 4 && sel.focusOffset === 1 && sel.direction === 'backward' && sel.getRangeAt(0).startOffset === 1);
  check('getRangeAt is stable', sel.getRangeAt(0) === sel.getRangeAt(0));
  check('getRangeAt(1) throws IndexSizeError', throws(() => sel.getRangeAt(1), 'IndexSizeError'));
  sel.selectAllChildren(b);
  check('selectAllChildren', sel.toString() === 'bold' && sel.containsNode(b.firstChild));
  check('containsNode partially', sel.containsNode(p, true) && !sel.containsNode(p));
  sel.collapse(text, 0);
  sel.modify('extend', 'forward', 'word');
  check('modify by word', sel.toString() === 'Hello');
  sel.modify('move', 'forward', 'character');
  check('modify move collapses', sel.isCollapsed && sel.focusOffset === 6);
  sel.collapseToStart();
  const own = document.createRange();
  own.setStart(text, 0);
  own.setEnd(text, 2);
  sel.removeAllRanges();
  sel.addRange(own);
  check('addRange keeps the range object', sel.getRangeAt(0) === own && sel.toString() === 'He');
  own.setEnd(text, 3);
  check('the selection follows its range', sel.toString() === 'Hel');
  let changes = 0;
  document.addEventListener('selectionchange', () => changes++);
  sel.collapse(text, 1);
  sel.collapse(text, 2);
  await new Promise((r) => setTimeout(r, 0));
  check('selectionchange fires once per task', changes === 1);

  // ----- text controls -----
  f.setSelectionRange(1, 3);
  check('setSelectionRange', f.selectionStart === 1 && f.selectionEnd === 3 && f.selectionDirection === 'forward');
  f.setSelectionRange(4, 2);
  check('a start after the end collapses to the end', f.selectionStart === 2 && f.selectionEnd === 2);
  f.setRangeText('XY', 1, 3, 'select');
  check('setRangeText select', f.value === 'aXYdef' && f.selectionStart === 1 && f.selectionEnd === 3);
  f.setRangeText('Z');
  check('setRangeText at the selection', f.value === 'aZdef');
  f.select();
  check('select()', f.selectionStart === 0 && f.selectionEnd === 5);
  f.value = 'new';
  check('setting the value puts the caret at the end', f.selectionStart === 3 && f.selectionEnd === 3);
  check('textarea selection', ta.selectionStart === ta.value.length);
  check('number inputs have no selection', num.selectionStart === null && throws(() => num.setSelectionRange(0, 0), 'InvalidStateError'));

  // ----- editing -----
  check('isContentEditable', ed.isContentEditable && e1.isContentEditable && !p.isContentEditable);
  check('contentEditable', ed.contentEditable === 'true' && p.contentEditable === 'inherit');
  check('queryCommandSupported', document.queryCommandSupported('insertText') && !document.queryCommandSupported('bold'));
  check('an unsupported command returns false', document.execCommand('bold') === false);
  ed.focus();
  sel.collapse(e1.firstChild, 3);
  const types = [];
  ed.addEventListener('input', (e) => types.push(e.inputType));
  check('execCommand insertText', document.execCommand('insertText', false, '!') && e1.textContent === 'one! two');
  document.execCommand('insertParagraph');
  check('execCommand insertParagraph splits the block', ed.children.length === 3 && ed.children[1].textContent === ' two');
  document.execCommand('delete');
  check('execCommand delete joins the blocks', ed.children.length === 2 && e1.textContent === 'one! two');
  check('input events from execCommand', types.join() === 'insertText,insertParagraph,deleteContentBackward');

  // ----- clipboard -----
  check('ClipboardEvent', new ClipboardEvent('copy') instanceof Event && new ClipboardEvent('copy').clipboardData === null);
  check('readText is not allowed', await rejects(navigator.clipboard.readText(), 'NotAllowedError'));
  check('writeText needs an activation', await rejects(navigator.clipboard.writeText('x'), 'NotAllowedError'));
  check('copy needs an activation', document.execCommand('copy') === false);

  document.getElementById('out').textContent = JSON.stringify(results);
}
main().catch((e) => { document.getElementById('out').textContent = JSON.stringify([['main threw ' + e + ' ' + e.stack, false]]); });
</script>
</body></html>
