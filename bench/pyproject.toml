[project]
name = "pageon-bench"
version = "0.0.2"
description = "pageon's serializer proof: compares observation formats on BrowserGym tasks with a local model"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pageon",
    "playwright>=1.49",
    "browsergym-core>=0.13",
    "browsergym-miniwob>=0.13",
    "openai>=1.50",
    "numpy>=1.26",
    "psutil>=5.9",
]

[project.optional-dependencies]
baselines = ["browser-use==1.0.2"]

[project.scripts]
pageon-bench = "pageon_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
pageon = { path = "../bindings/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pageon_bench"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
# `×` and `–` are part of the observation format and of page titles.
ignore = ["RUF001", "RUF002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
