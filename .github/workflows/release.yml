name: Release

# Cuts a release from a tag `v<version>` on main. Builds the pageon binary for macOS (Apple
# Silicon) and Linux (x86_64, aarch64) and the Python wheels, attests their build provenance and
# publishes the GitHub Release with the CHANGELOG notes. For a release, not a pre-release (a
# version with `-`), it then publishes the crates and the Python package, updates the Homebrew
# tap, and installs the result on clean runners.
#
# Owner setup (once, before the first tag):
# - the tap hupe1980/homebrew-tap (the formula goes to Formula/pageon.rb beside the others), and a
#   GitHub App installed on that repository only, with repository permission contents: read and
#   write (the App mrun and speccoder use serves);
# - GitHub environment `release`, deployment rule: tags `v*`, holding HOMEBREW_APP_ID and
#   HOMEBREW_APP_PRIVATE_KEY;
# - GitHub environment `crates-io`, deployment rule: tags `v*`, holding CARGO_REGISTRY_TOKEN (a
#   crates.io token with publish-new and publish-update for `pageon` and `pageon-*`, with an
#   expiry). Once the crates exist, trusted publishing can replace it;
# - GitHub environment `pypi`, deployment rule: tags `v*`, and on PyPI a trusted publisher for
#   `pageon` (owner hupe1980, repository pageon, workflow release.yml, environment pypi). No
#   token is stored.
#
# Third-party actions are pinned by commit: this workflow holds write tokens.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install # from rust-toolchain.toml
      - id: check
        run: scripts/release/preflight.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      # Every crate packages (manifests, includes, the 10 MB limit) before anything is built.
      - run: |
          cargo package --locked --no-verify \
            -p pageon-dom -p pageon-env -p pageon-agent -p pageon-net \
            -p pageon-layout -p pageon-ax -p pageon-js -p pageon

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install && rustup target add "$TARGET"
      - run: cargo build --release --locked -p pageon --target "$TARGET"
      # The binary on its own: its version, and a page in the sandbox.
      - name: Smoke
        run: |
          bin="target/$TARGET/release/pageon"
          [ "$("$bin" --version)" = "pageon $VERSION" ] || { "$bin" --version; exit 1; }
          printf '<h1>Hello</h1><button>Go</button>' > "$RUNNER_TEMP/page.html"
          "$bin" fetch "$RUNNER_TEMP/page.html" --dump ax | grep -q 'button e1 "Go"'
      - name: Archive
        run: |
          name="pageon-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/pageon" LICENSE-APACHE LICENSE-MIT README.md THIRD_PARTY.md CHANGELOG.md "dist/$name/"
          cp crates/pageon-layout/fonts/LICENSE "dist/$name/LICENSE-fonts"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The Python package: one abi3 wheel per platform (it links only the view serializer; the
  # browser is the `pageon` binary) and the source distribution.
  wheels:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            os: ubuntu-22.04
          - target: aarch64
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  sdist:
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [preflight, build, wheels, sdist]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true
      - run: (cd dist && cat ./*.sha256 > SHA256SUMS && shasum -a 256 -c SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            wheels/*
      - name: Publish the GitHub Release
        run: |
          tag="v$VERSION"
          if state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [ "$state" = true ] || { echo "release $tag is already published; assets are never overwritten"; exit 1; }
          else
            flags=()
            [ "$PRERELEASE" = true ] && flags+=(--prerelease)
            scripts/release/changelog-section.sh "$VERSION" > notes.md
            gh release create "$tag" --draft --verify-tag --title "pageon $VERSION" --notes-file notes.md "${flags[@]}"
          fi
          # An upload GitHub took but did not answer is retried by gh and refused as "already
          # exists"; a second pass with --clobber replaces it.
          for attempt in 1 2 3; do
            gh release upload "$tag" dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS --clobber && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          gh release edit "$tag" --draft=false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256sums
          path: dist/SHA256SUMS

  crates:
    needs: [preflight, release]
    if: needs.preflight.outputs.prerelease == 'false'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    environment: crates-io
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: The token is there
        run: |
          [ -n "$CARGO_REGISTRY_TOKEN" ] || { echo "CARGO_REGISTRY_TOKEN is not set in the environment crates-io"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: scripts/release/publish.sh "$VERSION"

  pypi:
    needs: [preflight, release]
    if: needs.preflight.outputs.prerelease == 'false'
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      # Trusted publishing: PyPI exchanges this job's OIDC token; nothing is stored.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  tap:
    needs: [preflight, release]
    if: needs.preflight.outputs.prerelease == 'false'
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
          path: dist
      # A short-lived installation token that can write to the tap only.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: hupe1980
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hupe1980/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: tap
          persist-credentials: true
      - name: Update the formula
        run: |
          mkdir -p tap/Formula
          scripts/release/formula.sh "$VERSION" dist/SHA256SUMS > tap/Formula/pageon.rb
          cd tap
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "pageon release"
            git config user.email "pageon-release@users.noreply.github.com"
            git add Formula/pageon.rb
            git commit -m "pageon $VERSION"
            git push
          fi

  # Installs the release from the tap on clean runners, and runs the formula's test (a page in
  # the sandbox). Linux aarch64 is checked in its build job (no Homebrew on those runners).
  smoke:
    needs: [preflight, tap]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Homebrew
        run: |
          if [ "$RUNNER_OS" = Linux ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew install hupe1980/tap/pageon
          brew test pageon
          [ "$(pageon --version)" = "pageon $VERSION" ]
