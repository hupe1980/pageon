[workspace]
members = ["crates/*", "xtask", "bindings/python"]
resolver = "3"

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/pageon"
homepage = "https://hupe1980.github.io/pageon/"
authors = ["hupe1980"]

[workspace.dependencies]
pageon-agent = { path = "crates/pageon-agent", version = "0.4.1" }
pageon-ax = { path = "crates/pageon-ax", version = "0.4.1" }
pageon-dom = { path = "crates/pageon-dom", version = "0.4.1" }
pageon-env = { path = "crates/pageon-env", version = "0.4.1" }
pageon-js = { path = "crates/pageon-js", version = "0.4.1" }
pageon-layout = { path = "crates/pageon-layout", version = "0.4.1" }
pageon-net = { path = "crates/pageon-net", version = "0.4.1" }
procage = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Painting is slow unoptimized (seconds per screenshot): tests and traces paint in debug too.
[profile.dev.package]
vello_cpu.opt-level = 3
vello_common.opt-level = 3
fearless_simd.opt-level = 3
tiny-skia.opt-level = 3
image.opt-level = 3
zune-jpeg.opt-level = 3

# Symbols stripped: 25 MB less for `cargo install pageon`.
[profile.release]
strip = "symbols"

# Shipped binaries and wheels: one codegen unit, whole-program LTO, no symbols.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
