[workspace]
members = ["crates/*", "xtask", "bindings/python"]
resolver = "3"

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/pageon"
homepage = "https://hupe1980.github.io/pageon/"
authors = ["hupe1980"]

[workspace.dependencies]
pageon-agent = { path = "crates/pageon-agent", version = "0.0.2" }
pageon-ax = { path = "crates/pageon-ax", version = "0.0.2" }
pageon-dom = { path = "crates/pageon-dom", version = "0.0.2" }
pageon-env = { path = "crates/pageon-env", version = "0.0.2" }
pageon-js = { path = "crates/pageon-js", version = "0.0.2" }
pageon-layout = { path = "crates/pageon-layout", version = "0.0.2" }
pageon-net = { path = "crates/pageon-net", version = "0.0.2" }
procage = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
